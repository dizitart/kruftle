name: kruftle
description: "Reclaim disk space from build artifacts across every project on your machine."
homepage: https://github.com/dizitart/kruftle
repository: https://github.com/dizitart/kruftle
publish_to: 'none'

version: 0.2.11+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.0.0

  # Core utilities
  path: ^1.9.0
  collection: ^1.19.0
  crypto: ^3.0.6
  http: ^1.2.2

  # Desktop integration
  file_selector: ^1.0.3
  window_manager: ^0.5.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  ffi: ^2.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/kruftle-512.png
    - assets/changelog.json
    - assets/legal/privacy-policy.md
    - assets/legal/terms-of-service.md

# Microsoft Store packaging. `dart run msix:create --store` reads this,
# wraps the already-built `build\windows\<arch>\runner\Release` (see
# .github/workflows/release.yml) and signs it with a throwaway test
# certificate — replaced for real when the Store re-signs the package on
# ingestion, which is the whole reason this sidesteps needing a trusted code
# signing certificate the way the Inno Setup .exe does. Version and
# architecture are overridden per build by CI; the rest is static.
msix_config:
  display_name: Kruftle
  publisher_display_name: Dizitart
  # From Partner Center's "Product identity" page — must match it exactly, or
  # Partner Center rejects the upload on ingestion.
  identity_name: Dizitart.Kruftle
  publisher: CN=BA8C138F-C78B-4DD1-BF6F-EDC73A8DA8CB
  msix_version: 1.0.0.0
  logo_path: assets/icon/kruftle-512.png
  capabilities: internetClient
  store: true
