<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kruftle app mark — "the sweep".

       A heavy amber meter ring, all but closed, whose leading end crumbles
       into motes and stops. It is the app in one gesture: occupied space,
       coming apart and going away. The gap that the motes fade into is the
       space you get back, and it is the largest thing in the picture.

       The mark is deliberately one shape and one colour. A ring survives being
       drawn at 16 pixels, which is the only size that really has to work; a
       letterform, a broom or a bin does not — the first says the name and
       nothing else, and the other two read as a consumer cleaner rather than a
       developer tool.

       The previous mark, a dissolving K, is kept as `kruftle-legacy.svg`.

       Regenerate every raster from this file with `./tool/make_icons.sh`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24272F"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <!-- userSpaceOnUse, not the default objectBoundingBox: the ring and the
         motes are separate elements, and only a shared user-space gradient
         shades them as one object. It also keeps the light coming from the
         same place regardless of each mote's own bounding box, which is what
         makes them look like pieces of the ring rather than dots. -->
    <linearGradient id="amber" gradientUnits="userSpaceOnUse"
                    x1="230" y1="810" x2="850" y2="250">
      <stop offset="0" stop-color="#FFD182"/>
      <stop offset="0.5" stop-color="#EFAF48"/>
      <stop offset="1" stop-color="#C57C18"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="225" fill="none"
        stroke="#E0A33C" stroke-opacity="0.16" stroke-width="8"/>

  <!-- 186° of ring, thick, round-capped. Centred on (532, 528) rather than on
       the canvas centre: the motes carry weight out to the right, so the ring
       has to sit right of centre for the whole mark to look centred. -->
  <path d="M 363.3 743.9 A 274 274 0 1 1 722.3 330.9" fill="none"
        stroke="url(#amber)" stroke-width="130" stroke-linecap="round"/>

  <!-- The crumbling end. The first mote overlaps the cap on purpose, so the
       ring appears to break rather than to simply stop and be followed by
       dots. -->
  <g fill="url(#amber)">
    <circle cx="776.2" cy="387.0" r="53" opacity="0.95"/>
    <circle cx="817.6" cy="467.3" r="37" opacity="0.82"/>
    <circle cx="834.3" cy="559.8" r="24" opacity="0.68"/>
    <circle cx="823.1" cy="645.6" r="15" opacity="0.52"/>
    <circle cx="792.5" cy="717.3" r="9"  opacity="0.38"/>
  </g>
</svg>
