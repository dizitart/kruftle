name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Flutter version is pinned rather than tracking stable.
#
# `dart format` output changes between Flutter releases, so an unpinned CI
# reformats files the developer's own toolchain formatted correctly and fails
# the check for no real reason. Pinning makes local and CI byte-identical.
# Bumping is deliberate: change this one value, run `dart format .`, commit.
env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.name }}
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is one build for both processors — the bundle is universal,
          # which the release workflow asserts with `lipo`.
          - { os: macos-latest,      name: macOS,         target: macos }
          - { os: windows-latest,    name: Windows x64,   target: windows }
          - { os: windows-11-arm,    name: Windows arm64, target: windows }
          - { os: ubuntu-latest,     name: Linux x64,     target: linux }
          - { os: ubuntu-22.04-arm,  name: Linux arm64,   target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Flutter publishes an arm64 SDK archive for macOS only -- the Windows
      # and Linux release manifests list x64 alone -- so `flutter-action`
      # cannot install one on an arm64 runner for those platforms. There the
      # SDK is cloned at the pinned tag instead; it bootstraps its own Dart
      # SDK and engine artifacts on first run.
      - uses: subosito/flutter-action@v2
        if: runner.arch != 'ARM64' || runner.os == 'macOS'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter from source (Linux arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter from source (Windows arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 -b $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git C:\flutter
          Add-Content $env:GITHUB_PATH 'C:\flutter\bin'

      - name: Show the toolchain in use
        run: flutter --version
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      # A release build is the only thing that catches platform-specific
      # breakage, which is most of what breaks in a desktop Flutter app.
      - run: flutter build ${{ matrix.target }} --release
