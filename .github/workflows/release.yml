name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

# The Flutter version is pinned rather than tracking stable.
#
# `dart format` output changes between Flutter releases, so an unpinned CI
# reformats files the developer's own toolchain formatted correctly and fails
# the check for no real reason. Pinning makes local and CI byte-identical.
# Bumping is deliberate: change this one value, run `dart format .`, commit.
env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The running app compares itself against release tags using
          # `kAppVersion`, which a test holds equal to pubspec.yaml. If the tag
          # disagreed with either, the release would either be invisible to
          # everyone running it or offered to the very build it came from.
          PUBSPEC=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "tag $VERSION does not match pubspec.yaml ($PUBSPEC)" >&2
            exit 1
          fi

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Flutter publishes an arm64 SDK archive for macOS only -- the Windows
      # and Linux release manifests list x64 alone -- so `flutter-action`
      # cannot install one on an arm64 runner for those platforms. There the
      # SDK is cloned at the pinned tag instead; it bootstraps its own Dart
      # SDK and engine artifacts on first run.
      - uses: subosito/flutter-action@v2
        if: runner.arch != 'ARM64' || runner.os == 'macOS'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter from source (Linux arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter from source (Windows arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 -b $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git C:\flutter
          Add-Content $env:GITHUB_PATH 'C:\flutter\bin'

      - name: Show the toolchain in use
        run: flutter --version
      - run: flutter pub get
      - name: Build
        run: flutter build macos --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Sign ad-hoc
        # Not a Developer ID signature — Kruftle ships unsigned. An ad-hoc
        # signature still gives the bundle a stable identity, which stops
        # macOS reporting it as damaged rather than merely unverified.
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/Kruftle.app

      - name: Check the bundle is universal
        # The .dmg carries one bundle for both processors, which is why its
        # name mentions no architecture and why the updater treats an
        # unlabelled asset as universal. If this ever stopped being true the
        # asset would silently become wrong for half of macOS.
        run: |
          BINARY=build/macos/Build/Products/Release/Kruftle.app/Contents/MacOS/Kruftle
          lipo -archs "$BINARY"
          lipo -archs "$BINARY" | grep -q arm64
          lipo -archs "$BINARY" | grep -q x86_64

      # The archive the in-app updater applies, and the reason a macOS update no
      # longer opens a disk image. `ditto`, not `zip`: it is the only archiver
      # on macOS that keeps a bundle's symlinks, resource forks and executable
      # bits intact, and `ditto -x -k` on the other end restores them.
      # Made after the ad-hoc signature, so the signature travels with it.
      - name: Package update archive
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Kruftle.app \
            "dist/Kruftle-$VERSION-macos.zip"

      # Still published: it is how someone installs Kruftle the first time, and
      # it is what a copy running from an older release knows how to apply.
      - name: Package .dmg
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p dist staging
          cp -R build/macos/Build/Products/Release/Kruftle.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Kruftle" -srcfolder staging -ov \
            -format UDZO "dist/Kruftle-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    # `windows-11-arm` is a native arm64 runner, so the arm64 build is a real
    # build rather than a cross-compile: Flutter's Windows desktop target does
    # not cross-compile, and neither does Inno Setup's output.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      # Flutter publishes an arm64 SDK archive for macOS only -- the Windows
      # and Linux release manifests list x64 alone -- so `flutter-action`
      # cannot install one on an arm64 runner for those platforms. There the
      # SDK is cloned at the pinned tag instead; it bootstraps its own Dart
      # SDK and engine artifacts on first run.
      - uses: subosito/flutter-action@v2
        if: runner.arch != 'ARM64' || runner.os == 'macOS'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter from source (Linux arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter from source (Windows arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 -b $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git C:\flutter
          Add-Content $env:GITHUB_PATH 'C:\flutter\bin'

      - name: Show the toolchain in use
        run: flutter --version
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Package installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Brace syntax is required: PowerShell reads "$env:ProgramFiles(x86)"
          # as $env:ProgramFiles followed by a literal (x86), which yields
          # "C:\Program Files(x86)" with the space eaten.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DTargetArch=${{ matrix.arch }}" `
            "/Odist" packaging\windows\kruftle.iss

      # The archive the in-app updater actually applies: the Release directory
      # and nothing else, so unpacking it over an install replaces that install
      # exactly. The installer stays for first-time installs and for machine-wide
      # copies, which cannot replace themselves.
      - name: Package update archive
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $src = "build\windows\$env:ARCH\runner\Release"
          if (-not (Test-Path $src)) { throw "no release build at $src" }
          Compress-Archive -Path "$src\*" `
            -DestinationPath "dist\Kruftle-$env:VERSION-windows-$env:ARCH.zip" `
            -CompressionLevel Optimal

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # Native runners for both, for the same reason as Windows: Flutter's Linux
    # desktop target builds for the host, and appimagetool needs to run the
    # binaries it is packaging.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      # Flutter publishes an arm64 SDK archive for macOS only -- the Windows
      # and Linux release manifests list x64 alone -- so `flutter-action`
      # cannot install one on an arm64 runner for those platforms. There the
      # SDK is cloned at the pinned tag instead; it bootstraps its own Dart
      # SDK and engine artifacts on first run.
      - uses: subosito/flutter-action@v2
        if: runner.arch != 'ARM64' || runner.os == 'macOS'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter from source (Linux arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Flutter from source (Windows arm64)
        if: runner.arch == 'ARM64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 -b $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git C:\flutter
          Add-Content $env:GITHUB_PATH 'C:\flutter\bin'

      - name: Show the toolchain in use
        run: flutter --version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev desktop-file-utils fuse
      - run: flutter pub get
      - name: Build
        run: flutter build linux --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package AppImage and deb
        run: |
          packaging/linux/build-packages.sh \
            ${{ needs.version.outputs.version }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  publish:
    name: Publish release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          # The in-app updater refuses to install anything whose SHA-256 is not
          # listed here, so this file is a hard requirement of every release,
          # not a nicety.
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.version.outputs.version }}
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kruftle $VERSION" \
            --generate-notes \
            --verify-tag || \
          gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      # kruftle.dizitart.com rewrites its download links, changelog and legal
      # pages from this release and redeploys itself. GITHUB_TOKEN cannot reach
      # another repository, so this needs a token that can. Without the secret
      # the step says so and stands down; the site's own six-hourly check picks
      # the release up instead.
      - name: Tell the site there is a new release
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no SITE_SYNC_TOKEN set; the site will pick this release up"
            echo "on its own six-hourly check instead."
            exit 0
          fi
          gh api repos/dizitart/kruftle-site/dispatches --input - <<JSON
          {"event_type":"kruftle-release","client_payload":{"version":"$VERSION"}}
          JSON
