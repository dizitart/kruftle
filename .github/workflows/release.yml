name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

# The Flutter version is pinned rather than tracking stable.
#
# `dart format` output changes between Flutter releases, so an unpinned CI
# reformats files the developer's own toolchain formatted correctly and fails
# the check for no real reason. Pinning makes local and CI byte-identical.
# Bumping is deliberate: change this one value, run `dart format .`, commit.
env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build macos --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Sign ad-hoc
        # Not a Developer ID signature — Kruftle ships unsigned. An ad-hoc
        # signature still gives the bundle a stable identity, which stops
        # macOS reporting it as damaged rather than merely unverified.
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/Kruftle.app

      - name: Check the bundle is universal
        # The .dmg carries one bundle for both processors, which is why its
        # name mentions no architecture and why the updater treats an
        # unlabelled asset as universal. If this ever stopped being true the
        # asset would silently become wrong for half of macOS.
        run: |
          BINARY=build/macos/Build/Products/Release/Kruftle.app/Contents/MacOS/Kruftle
          lipo -archs "$BINARY"
          lipo -archs "$BINARY" | grep -q arm64
          lipo -archs "$BINARY" | grep -q x86_64

      - name: Package .dmg
        run: |
          VERSION=${{ needs.version.outputs.version }}
          mkdir -p dist staging
          cp -R build/macos/Build/Products/Release/Kruftle.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Kruftle" -srcfolder staging -ov \
            -format UDZO "dist/Kruftle-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    # `windows-11-arm` is a native arm64 runner, so the arm64 build is a real
    # build rather than a cross-compile: Flutter's Windows desktop target does
    # not cross-compile, and neither does Inno Setup's output.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Package installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Brace syntax is required: PowerShell reads "$env:ProgramFiles(x86)"
          # as $env:ProgramFiles followed by a literal (x86), which yields
          # "C:\Program Files(x86)" with the space eaten.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DTargetArch=${{ matrix.arch }}" `
            "/Odist" packaging\windows\kruftle.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # Native runners for both, for the same reason as Windows: Flutter's Linux
    # desktop target builds for the host, and appimagetool needs to run the
    # binaries it is packaging.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev desktop-file-utils fuse
      - run: flutter pub get
      - name: Build
        run: flutter build linux --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package AppImage and deb
        run: |
          packaging/linux/build-packages.sh \
            ${{ needs.version.outputs.version }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb

  publish:
    name: Publish release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist
          # The in-app updater refuses to install anything whose SHA-256 is not
          # listed here, so this file is a hard requirement of every release,
          # not a nicety.
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.version.outputs.version }}
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kruftle $VERSION" \
            --generate-notes \
            --verify-tag || \
          gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
