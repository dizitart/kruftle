# Flutter's own localisation generator. No third-party string loader: the
# tooling that ships with the SDK produces a typed class from ARB files at
# build time, which is both less code and one fewer dependency to audit.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L
nullable-getter: false
